name: Android APK validation

on:
  push:
    branches:
      - feature/xray-profile-import
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run custom profile importer tests
        run: ./gradlew :app:testProductionVanillaOpenSourceDebugUnitTest --no-daemon

      - name: Assemble Android APK
        run: ./gradlew :app:assembleProductionVanillaOpenSourceDebug --no-daemon

      - name: Prepare universal APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            printf 'Expected exactly one unsplit APK, found %s\n' "${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          mkdir -p dist
          cp "${apks[0]}" dist/universal.apk
          sha256sum dist/universal.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-apk
          path: dist/universal.apk
          if-no-files-found: error
          retention-days: 14
